<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ 單字管理後台</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-btn { background: #4f46e5; color: white; padding: 8px 14px; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; }
    
    .card-box { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .input-row { display: flex; gap: 10px; }
    input, select { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; }
    button { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1rem; }
    
    .word-list { list-style: none; margin-top: 10px; }
    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <h2>⚙️ 單字管理後台</h2>
    <a href="/" class="nav-btn">🎴 回到複習卡片 →</a>
  </div>

  <!-- 新增單字表單 -->
  <div class="card-box">
    <h3>➕ 新增單字</h3>
    <form id="addForm" class="form-group">
      <div class="input-row">
        <input type="text" id="inWord" placeholder="英文單字 (例: Apple)" required>
        <input type="text" id="inTrans" placeholder="中文翻譯 (例: 蘋果)" required>
      </div>

      <!-- 分類選擇區：選擇現有分類 或 輸入新分類 -->
      <div class="input-row">
        <select id="selectCat" onchange="toggleCatInput()">
          <option value="NEW">+ 輸入新分類...</option>
        </select>
        <input type="text" id="inCat" placeholder="請輸入新分類名稱 (例: 多益)">
      </div>

      <button type="submit">儲存單字</button>
    </form>
  </div>

  <!-- 單字列表 -->
  <div class="card-box">
    <h3>📋 所有單字列表</h3>
    <ul class="word-list" id="wordList"></ul>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    loadCategories();
    loadWords();
  });

  // 1. 載入資料庫內所有已存在的分類
  async function loadCategories() {
    const res = await fetch('/api/categories');
    const categories = await res.json();
    const selectCat = document.getElementById('selectCat');
    
    // 清空並重新建立選項
    selectCat.innerHTML = '';
    
    // 將資料庫裡的每一個分類都放進選單
    categories.forEach(cat => {
      selectCat.innerHTML += `<option value="${cat}">${cat}</option>`;
    });
    
    // 預留一個選項供「新增新分類」
    selectCat.innerHTML += `<option value="NEW">➕ 建立新分類...</option>`;
    
    toggleCatInput();
  }

  // 切換「輸入框」的顯示狀態
  function toggleCatInput() {
    const selectCat = document.getElementById('selectCat');
    const inCat = document.getElementById('inCat');
    
    if (selectCat.value === 'NEW') {
      inCat.style.display = 'block';
      inCat.required = true;
    } else {
      inCat.style.display = 'none';
      inCat.required = false;
    }
  }

  // 2. 載入單字列表
  async function loadWords() {
    const res = await fetch('/api/words?category=ALL');
    const words = await res.json();
    const list = document.getElementById('wordList');
    
    if (words.length === 0) {
      list.innerHTML = '<li style="color:#9ca3af; text-align:center; padding:15px;">目前還沒有任何單字喔！</li>';
      return;
    }

    list.innerHTML = words.map(w => `
      <li class="word-item">
        <div>
          <strong style="font-size:1.1rem;">${w.word}</strong> - <span style="color:#4b5563;">${w.translation}</span>
          <span style="font-size:0.8rem; background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:10px; margin-left:6px;">${w.category}</span>
        </div>
        <button class="del-btn" onclick="deleteWord(${w.id})">刪除</button>
      </li>
    `).join('');
  }

  // 3. 送出表單
  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const word = document.getElementById('inWord').value;
    const translation = document.getElementById('inTrans').value;
    
    const selectCat = document.getElementById('selectCat');
    const inCat = document.getElementById('inCat');

    // 如果選「建立新分類」就拿輸入框的值，否則拿選單選好的分類
    let category = selectCat.value === 'NEW' ? inCat.value : selectCat.value;

    const res = await fetch('/api/words', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word, translation, category })
    });

    if (res.ok) {
      document.getElementById('inWord').value = '';
      document.getElementById('inTrans').value = '';
      inCat.value = '';
      
      // 重新整理分類選單與單字列表
      await loadCategories();
      await loadWords();
    }
  });

  async function deleteWord(id) {
    if (confirm('確定要刪除這個單字嗎？')) {
      await fetch(`/api/words/${id}`, { method: 'DELETE' });
      await loadCategories();
      await loadWords();
    }
  }
</script>
</body>
</html>

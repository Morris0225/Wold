<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ 單字管理後台</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-btn { background: #4f46e5; color: white; padding: 8px 14px; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; }
    
    .card-box { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .input-row { display: flex; gap: 10px; }
    input, select { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; }
    button { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1rem; }
    button.import-btn { background: #6366f1; }
    
    .word-list { list-style: none; margin-top: 10px; }
    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    
    .file-hint { font-size: 0.85rem; color: #6b7280; background: #f9fafb; padding: 10px; border-radius: 6px; margin-bottom: 10px; line-height: 1.5; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFQA1RF9HK0V9OHwsEuFCT5qmGicFmsck",
      authDomain: "my-word-card.firebaseapp.com",
      projectId: "my-word-card",
      storageBucket: "my-word-card.firebasestorage.app",
      messagingSenderId: "495321698729",
      appId: "1:495321698729:web:14939264ad32ad297034b8",
      measurementId: "G-4YPWJVZZV1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let words = [];

    window.addEventListener('DOMContentLoaded', () => {
      loadWords();
    });

    async function loadWords() {
      const q = query(collection(db, "words"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);
      words = [];
      querySnapshot.forEach((doc) => {
        words.push({ id: doc.id, ...doc.data() });
      });
      renderCategories();
      renderWords();
    }

    function renderCategories() {
      const categories = [...new Set(words.map(w => w.category))];
      const options = categories.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="NEW">➕ 建立新分類...</option>`;
      
      document.getElementById('selectCat').innerHTML = options;
      document.getElementById('importSelectCat').innerHTML = options;

      toggleCatInput();
      toggleImportCatInput();
    }

    window.toggleCatInput = function() {
      const selectCat = document.getElementById('selectCat');
      const inCat = document.getElementById('inCat');
      inCat.style.display = selectCat.value === 'NEW' ? 'block' : 'none';
      inCat.required = selectCat.value === 'NEW';
    }

    window.toggleImportCatInput = function() {
      const selectCat = document.getElementById('importSelectCat');
      const inCat = document.getElementById('importInCat');
      inCat.style.display = selectCat.value === 'NEW' ? 'block' : 'none';
      inCat.required = selectCat.value === 'NEW';
    }

    function renderWords() {
      const list = document.getElementById('wordList');
      if (words.length === 0) {
        list.innerHTML = '<li style="color:#9ca3af; text-align:center; padding:15px;">目前還沒有任何單字喔！</li>';
        return;
      }

      list.innerHTML = words.map(w => `
        <li class="word-item">
          <div>
            <strong style="font-size:1.1rem;">${w.word}</strong> - <span style="color:#4b5563;">${w.translation}</span>
            <span style="font-size:0.8rem; background:#e0e7ff; color:#3730a3; padding:2px 8px; border-radius:10px; margin-left:6px;">${w.category || '預設'}</span>
          </div>
          <button class="del-btn" onclick="deleteWord('${w.id}')">刪除</button>
        </li>
      `).join('');
    }

    // 單一新增提交
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const word = document.getElementById('inWord').value.trim();
      const translation = document.getElementById('inTrans').value.trim();
      const selectCat = document.getElementById('selectCat');
      const inCat = document.getElementById('inCat');
      let category = selectCat.value === 'NEW' ? inCat.value.trim() : selectCat.value;

      await addDoc(collection(db, "words"), {
        word, translation, category: category || '預設', createdAt: serverTimestamp()
      });

      document.getElementById('inWord').value = '';
      document.getElementById('inTrans').value = '';
      inCat.value = '';
      await loadWords();
    });

    // 📥 批次匯入提交
    document.getElementById('importForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      const selectCat = document.getElementById('importSelectCat');
      const inCat = document.getElementById('importInCat');
      let category = selectCat.value === 'NEW' ? inCat.value.trim() : selectCat.value;

      if (!fileInput.files.length) return alert('請選擇檔案！');

      const file = fileInput.files[0];
      const text = await file.text();
      const lines = text.split(/\r?\n/);

      let count = 0;
      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        let word = line, translation = '(未填寫)';
        if (line.includes(',') || line.includes('\t')) {
          const parts = line.replace('\t', ',').split(',', 2);
          word = parts[0].trim();
          translation = parts[1] ? parts[1].trim() : '(未填寫)';
        }
        if (word) {
          await addDoc(collection(db, "words"), {
            word, translation, category: category || '預設', createdAt: serverTimestamp()
          });
          count++;
        }
      }

      alert(`🎉 成功匯入 ${count} 個單字！`);
      fileInput.value = '';
      inCat.value = '';
      await loadWords();
    });

    window.deleteWord = async function(id) {
      if (confirm('確定要刪除這個單字嗎？')) {
        await deleteDoc(doc(db, "words", id));
        await loadWords();
      }
    }
  </script>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <h2>⚙️ 單字管理後台</h2>
    <a href="index.html" class="nav-btn">🎴 回到複習卡片 →</a>
  </div>

  <!-- 📥 批次匯入單字區塊 -->
  <div class="card-box">
    <h3>📥 批次匯入單字 (.txt / .csv)</h3>
    <div class="file-hint">
      💡 格式說明：每行一個單字，英文與中文用<strong>逗號</strong>隔開。<br>
      例如：<code>Apple, 蘋果</code> 或 <code>Cat, 貓咪</code>
    </div>
    <form id="importForm" class="form-group">
      <div class="input-row">
        <select id="importSelectCat" onchange="toggleImportCatInput()">
          <option value="NEW">➕ 建立新分類...</option>
        </select>
        <input type="text" id="importInCat" placeholder="請輸入匯入單字的分類名稱 (例: 多益)">
      </div>
      <input type="file" id="fileInput" accept=".txt,.csv" required style="border: 1px dashed #a5b4fc; padding: 15px; background: #eef2ff;">
      <button type="submit" class="import-btn">開始批次匯入</button>
    </form>
  </div>

  <!-- ➕ 單一新增單字 -->
  <div class="card-box">
    <h3>➕ 新增單一單字</h3>
    <form id="addForm" class="form-group">
      <div class="input-row">
        <input type="text" id="inWord" placeholder="英文單字 (例: Apple)" required>
        <input type="text" id="inTrans" placeholder="中文翻譯 (例: 蘋果)" required>
      </div>

      <div class="input-row">
        <select id="selectCat" onchange="toggleCatInput()">
          <option value="NEW">➕ 建立新分類...</option>
        </select>
        <input type="text" id="inCat" placeholder="請輸入新分類名稱">
      </div>

      <button type="submit">儲存單字</button>
    </form>
  </div>

  <!-- 單字列表 -->
  <div class="card-box">
    <h3>📋 所有單字列表</h3>
    <ul class="word-list" id="wordList"></ul>
  </div>
</div>

</body>
</html>

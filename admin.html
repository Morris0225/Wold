<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ 單字管理後台</title>
  <style>
    :root { --primary: #4f46e5; --bg: #f3f4f6; --card-bg: #ffffff; --text: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .nav-btn { background: #4f46e5; color: white; padding: 8px 14px; text-decoration: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; }
    
    .card-box { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .input-row { display: flex; gap: 10px; }
    input, select, textarea { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; }
    textarea { height: 120px; resize: vertical; font-family: monospace; }
    button { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 1rem; }
    button.import-btn { background: #6366f1; }
    
    /* 📥 批次模式頁籤切換 */
    .tab-container { display: flex; gap: 8px; margin-top: 10px; margin-bottom: 10px; border-bottom: 2px solid #e5e7eb; }
    .tab-btn { background: none; border: none; padding: 8px 14px; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; border-radius: 0; cursor: pointer; font-size: 0.9rem; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
    .batch-actions { display: flex; justify-content: space-between; align-items: center; background: #f3f4f6; padding: 10px 15px; border-radius: 8px; margin-top: 10px; margin-bottom: 10px; }
    .batch-actions label { font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-danger { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    
    .word-list { list-style: none; margin-top: 10px; }
    .word-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f3f4f6; }
    .word-content { flex: 1; word-break: break-all; }
    .badge-unfamiliar { background: #fef3c7; color: #d97706; font-size:0.75rem; padding: 2px 6px; border-radius: 8px; margin-left: 4px; font-weight: bold; }
    .mark-btn { background: #f59e0b; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    
    .file-hint { font-size: 0.85rem; color: #6b7280; background: #f9fafb; padding: 10px; border-radius: 6px; line-height: 1.5; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBFQA1RF9HK0V9OHwsEuFCT5qmGicFmsck",
      authDomain: "my-word-card.firebaseapp.com",
      projectId: "my-word-card",
      storageBucket: "my-word-card.firebasestorage.app",
      messagingSenderId: "495321698729",
      appId: "1:495321698729:web:14939264ad32ad297034b8",
      measurementId: "G-4YPWJVZZV1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allWords = [];
    let filteredWords = [];
    let activeImportMode = 'TEXT'; // 'TEXT' 或 'FILE'

    window.addEventListener('DOMContentLoaded', () => {
      loadWords();
    });

    async function loadWords() {
      const q = query(collection(db, "words"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);
      allWords = [];
      querySnapshot.forEach((doc) => {
        allWords.push({ id: doc.id, ...doc.data() });
      });
      renderCategories();
      filterListWords();
    }

    function renderCategories() {
      const categories = [...new Set(allWords.map(w => w.category))];
      
      const formOptions = categories.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="NEW">➕ 建立新分類...</option>`;
      document.getElementById('selectCat').innerHTML = formOptions;
      document.getElementById('importSelectCat').innerHTML = formOptions;

      const listFilterSelect = document.getElementById('listFilterCat');
      const currentSelected = listFilterSelect.value || 'ALL';
      listFilterSelect.innerHTML = `<option value="ALL">📚 所有分類 (${allWords.length})</option>` +
        `<option value="UNFAMILIAR">🔥 不熟單字 (${allWords.filter(w=>w.isUnfamiliar).length})</option>` +
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
      listFilterSelect.value = (categories.includes(currentSelected) || currentSelected === 'UNFAMILIAR') ? currentSelected : 'ALL';

      toggleCatInput();
      toggleImportCatInput();
    }

    window.switchImportTab = function(mode) {
      activeImportMode = mode;
      document.getElementById('tabTextBtn').classList.toggle('active', mode === 'TEXT');
      document.getElementById('tabFileBtn').classList.toggle('active', mode === 'FILE');
      document.getElementById('textImportArea').style.display = mode === 'TEXT' ? 'block' : 'none';
      document.getElementById('fileImportArea').style.display = mode === 'FILE' ? 'block' : 'none';
    }

    window.filterListWords = function() {
      const selected = document.getElementById('listFilterCat').value;
      if (selected === 'ALL') filteredWords = allWords;
      else if (selected === 'UNFAMILIAR') filteredWords = allWords.filter(w => w.isUnfamiliar);
      else filteredWords = allWords.filter(w => w.category === selected);
      
      renderWords();
    }

    window.toggleCatInput = function() {
      const selectCat = document.getElementById('selectCat');
      const inCat = document.getElementById('inCat');
      inCat.style.display = selectCat.value === 'NEW' ? 'block' : 'none';
      inCat.required = selectCat.value === 'NEW';
    }

    window.toggleImportCatInput = function() {
      const selectCat = document.getElementById('importSelectCat');
      const inCat = document.getElementById('importInCat');
      inCat.style.display = selectCat.value === 'NEW' ? 'block' : 'none';
      inCat.required = selectCat.value === 'NEW';
    }

    function renderWords() {
      const list = document.getElementById('wordList');
      if (filteredWords.length === 0) {
        list.innerHTML = '<li style="color:#9ca3af; text-align:center; padding:15px;">此分類目前沒有單字喔！</li>';
        document.getElementById('selectAllCb').checked = false;
        return;
      }

      list.innerHTML = filteredWords.map(w => `
        <li class="word-item">
          <input type="checkbox" class="word-checkbox" value="${w.id}">
          <div class="word-content">
            <strong style="font-size:1.05rem;">${w.word}</strong> - <span style="color:#4b5563;">${w.translation}</span>
            <span style="font-size:0.75rem; background:#e0e7ff; color:#3730a3; padding:2px 6px; border-radius:8px; margin-left:4px;">${w.category || '預設'}</span>
            ${w.isUnfamiliar ? '<span class="badge-unfamiliar">🔥 不熟</span>' : ''}
          </div>
          <button class="mark-btn" onclick="toggleWordUnfamiliar('${w.id}', ${!!w.isUnfamiliar})">${w.isUnfamiliar ? '✅ 移出' : '🔥 不熟'}</button>
          <button class="del-btn" onclick="deleteWord('${w.id}')">刪除</button>
        </li>
      `).join('');

      document.getElementById('selectAllCb').checked = false;
    }

    window.toggleWordUnfamiliar = async function(id, currentStatus) {
      await updateDoc(doc(db, "words", id), { isUnfamiliar: !currentStatus });
      await loadWords();
    }

    window.toggleSelectAll = function() {
      const isChecked = document.getElementById('selectAllCb').checked;
      const checkboxes = document.querySelectorAll('.word-checkbox');
      checkboxes.forEach(cb => cb.checked = isChecked);
    }

    window.deleteSelectedWords = async function() {
      const selected = Array.from(document.querySelectorAll('.word-checkbox:checked')).map(cb => cb.value);
      if (selected.length === 0) {
        alert('請先勾選要刪除的單字！');
        return;
      }

      if (confirm(`確定要刪除選取的 ${selected.length} 個單字嗎？`)) {
        const batch = writeBatch(db);
        selected.forEach(id => {
          batch.delete(doc(db, "words", id));
        });
        await batch.commit();
        alert('🎉 批次刪除成功！');
        await loadWords();
      }
    }

    // 單一新增提交
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const word = document.getElementById('inWord').value.trim();
      const translation = document.getElementById('inTrans').value.trim();
      const selectCat = document.getElementById('selectCat');
      const inCat = document.getElementById('inCat');
      let category = selectCat.value === 'NEW' ? inCat.value.trim() : selectCat.value;

      await addDoc(collection(db, "words"), {
        word, translation, category: category || '預設', isUnfamiliar: false, createdAt: serverTimestamp()
      });

      document.getElementById('inWord').value = '';
      document.getElementById('inTrans').value = '';
      inCat.value = '';
      await loadWords();
    });

    // 📥 批次匯入提交（文字框 / 檔案 雙模式）
    document.getElementById('importForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const selectCat = document.getElementById('importSelectCat');
      const inCat = document.getElementById('importInCat');
      let category = selectCat.value === 'NEW' ? inCat.value.trim() : selectCat.value;

      let text = '';
      if (activeImportMode === 'TEXT') {
        text = document.getElementById('textAreaInput').value;
        if (!text.trim()) return alert('請在文字框中貼上或輸入單字！');
      } else {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files.length) return alert('請選擇檔案！');
        text = await fileInput.files[0].text();
      }

      const lines = text.split(/\r?\n/);
      let batch = writeBatch(db);
      let count = 0;
      let batchCounter = 0;

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        let word = line, translation = '(未填寫)';
        if (line.includes(',') || line.includes('\t')) {
          const parts = line.replace('\t', ',').split(',', 2);
          word = parts[0].trim();
          translation = parts[1] ? parts[1].trim() : '(未填寫)';
        }
        if (word) {
          const newDocRef = doc(collection(db, "words"));
          batch.set(newDocRef, {
            word, translation, category: category || '預設', isUnfamiliar: false, createdAt: serverTimestamp()
          });
          count++;
          batchCounter++;

          if (batchCounter >= 400) {
            await batch.commit();
            batch = writeBatch(db);
            batchCounter = 0;
          }
        }
      }

      if (batchCounter > 0) {
        await batch.commit();
      }

      alert(`🎉 成功匯入 ${count} 個單字！`);
      document.getElementById('textAreaInput').value = '';
      document.getElementById('fileInput').value = '';
      inCat.value = '';
      await loadWords();
    });

    window.deleteWord = async function(id) {
      if (confirm('確定要刪除這個單字嗎？')) {
        await deleteDoc(doc(db, "words", id));
        await loadWords();
      }
    }
  </script>
</head>
<body>

<div class="container">
  <div class="nav-bar">
    <h2>⚙️ 單字管理後台</h2>
    <a href="index.html" class="nav-btn">🎴 回到複習卡片 →</a>
  </div>

  <!-- 📥 批次匯入單字區塊 (支援頁籤切換) -->
  <div class="card-box">
    <h3>📥 批次新增單字</h3>
    
    <div class="tab-container">
      <button class="tab-btn active" id="tabTextBtn" onclick="switchImportTab('TEXT')">✍️ 手動貼上文字框</button>
      <button class="tab-btn" id="tabFileBtn" onclick="switchImportTab('FILE')">📁 上傳檔案 (.txt / .csv)</button>
    </div>

    <div class="file-hint">
      💡 格式說明：每行一個單字，英文與中文用<strong>逗號</strong>隔開。<br>
      例如：<br>
      <code>apple, 蘋果</code><br>
      <code>banana, 香蕉</code>
    </div>

    <form id="importForm" class="form-group">
      <div class="input-row">
        <select id="importSelectCat" onchange="toggleImportCatInput()"></select>
        <input type="text" id="importInCat" placeholder="請輸入匯入單字的分類名稱 (例: 多益)">
      </div>

      <!-- 文字框模式 -->
      <div id="textImportArea">
        <textarea id="textAreaInput" placeholder="請直接貼上多行單字，例如：&#10;apple, 蘋果&#10;cat, 貓咪"></textarea>
      </div>

      <!-- 檔案模式 -->
      <div id="fileImportArea" style="display: none;">
        <input type="file" id="fileInput" accept=".txt,.csv" style="border: 1px dashed #a5b4fc; padding: 15px; background: #eef2ff;">
      </div>

      <button type="submit" class="import-btn">開始批次新增</button>
    </form>
  </div>

  <div class="card-box">
    <h3>➕ 新增單一單字</h3>
    <form id="addForm" class="form-group">
      <div class="input-row">
        <input type="text" id="inWord" placeholder="英文單字 (例: Apple)" required>
        <input type="text" id="inTrans" placeholder="中文翻譯 (例: 蘋果)" required>
      </div>

      <div class="input-row">
        <select id="selectCat" onchange="toggleCatInput()"></select>
        <input type="text" id="inCat" placeholder="請輸入新分類名稱">
      </div>

      <button type="submit">儲存單字</button>
    </form>
  </div>

  <div class="card-box">
    <div class="list-header">
      <h3>📋 單字列表</h3>
      <select id="listFilterCat" onchange="filterListWords()" style="max-width: 200px; font-weight: 600;">
        <option value="ALL">📚 所有分類</option>
      </select>
    </div>
    
    <div class="batch-actions">
      <label>
        <input type="checkbox" id="selectAllCb" onchange="toggleSelectAll()"> 全選當前單字
      </label>
      <button class="btn-danger" onclick="deleteSelectedWords()">🗑️ 刪除勾選單字</button>
    </div>

    <ul class="word-list" id="wordList"></ul>
  </div>
</div>

</body>
</html>
